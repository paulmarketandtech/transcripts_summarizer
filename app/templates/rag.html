{% extends 'base.html' %}
{% block title %}Ask AI — YT Summarizer{% endblock %}

{% block content %}

<section class="rag-section">
    <h2>Ask across all summaries</h2>
    <p class="hint">Ask about what creators discussed over time. The AI searches through all summaries to find relevant insights.</p>

    <form id="rag-form" class="rag-form">
        <textarea
            id="rag-query"
            placeholder="e.g. What was being said about NVIDIA earnings in Q2 2024?"
            rows="3"
            required
        ></textarea>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="rag-results" class="rag-results"></div>
</section>

{% endblock %}
