<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YT Summarizer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="/">📊 Market Insights</a></h1>
            <nav>
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Browse</a>
                <a href="/rag" class="{% if request.url.path == '/rag' %}active{% endif %}">Ask AI</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>Curated market analysis summaries</p>
        </footer>
    </div>

    <script src="{{ url_for('static', path='/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
