[project]
name = "summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "fastapi-swagger-dark>=0.0.9",
  "fastapi[standard]>=0.143.0",
  "jinja2>=3.1.6",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "slowapi>=0.1.10",
  "sqlalchemy>=2.0.51",
  "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# Add DTZ007 to the ignore list
ignore = ["DTZ007"]

[tool.ruff]
# Exclude a specific file or directory
extend-exclude = [
    "vendor/*",
    "**/migrations/*.py"
]   
[tool.bandit]
exclude_dirs = [".venv", "tests", "build", "dist", "__pycache__"]   
